version: '3.8'

services:
  # Backend API Service (FastAPI + Gunicorn Multi-Worker)
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: healthcare_backend
    restart: always
    environment:
      - DB_URL=${DB_URL}
      - SECRET_KEY=${SECRET_KEY:-healthcare-super-secure-production-secret-key-2026}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=*
      - DEV_OTP_MODE=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Frontend Web Application (React SPA served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: healthcare_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Optional Cloudflare Tunnel for 24/7 Public Domain & HTTPS
  # Uncomment when you have a CLOUDFLARE_TUNNEL_TOKEN
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: healthcare_cloudflare_tunnel
  #   restart: always
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #     - backend
